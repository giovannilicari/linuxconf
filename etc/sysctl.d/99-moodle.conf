# Tuning kernel per VM frontend Moodle (Apache + PHP-FPM)
# DB e Redis su macchine separate: questa VM e' CLIENT verso DB/Redis.
# Applicare con: sysctl --system

# --- Memoria ---
# 0 = default kernel (euristico). Il valore 1 e' una raccomandazione per server Redis
# (fork del BGSAVE), qui non serve: con 1 il kernel non rifiuta mai un'allocazione
# e, in caso di esaurimento RAM, interviene direttamente l'OOM killer.
vm.overcommit_memory = 0
# Swap solo in caso estremo: la RAM e' dimensionata per non usarlo
vm.swappiness = 1
# Mantiene piu' a lungo in cache dentry/inode (molti file PHP e moodledata)
vm.vfs_cache_pressure = 50

# --- File descriptor ---
# fs.file-max rimosso: su Ubuntu 24.04 il default e' gia' ~9.2e18, impostarlo a
# 2000000 lo ABBASSA. Il limite che conta e' per processo (LimitNOFILE di systemd).
#fs.file-max = 2000000

# --- Code connessioni ---
# >= listen.backlog del pool PHP-FPM (1024)
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
# SYN queue: picchi di connessioni (login in massa, avvio quiz)
net.ipv4.tcp_max_syn_backlog = 4096
# Protezione SYN flood
net.ipv4.tcp_syncookies = 1

# --- Timeout ---
net.ipv4.tcp_fin_timeout = 15
# Deve restare sotto l'idle timeout di eventuali firewall tra frontend e DB/Redis
net.ipv4.tcp_keepalive_time = 1800

# --- Connessioni in uscita verso DB/Redis ---
# Parte da 10240 (non 1024): evita che una connessione in uscita occupi una porta
# su cui deve mettersi in ascolto un servizio locale (agent di monitoraggio, ecc.)
net.ipv4.ip_local_port_range = 10240 65535
# Riuso sicuro dei socket TIME_WAIT per le connessioni in uscita (questa VM e' client)
net.ipv4.tcp_tw_reuse = 1

# --- Prestazioni connessioni keep-alive (HTTP/2 client, DB, Redis) ---
# Non riparte da slow-start dopo una pausa sulla stessa connessione
net.ipv4.tcp_slow_start_after_idle = 0
