<VirtualHost *:80>
    ServerName moodledev.esempio.dev
    ServerAdmin admin@esempio.dev
    DocumentRoot /var/www

    Redirect permanent / https://moodledev.esempio.dev/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName moodledev.esempio.dev
    ServerAdmin admin@esempio.dev
    DocumentRoot /var/www
    
    # --- ABILITAZIONE HTTP/2 (Prestazioni Moodle Asset) ---
    Protocols h2 http/1.1

    # --- Requisito FONDAMENTALE Moodle accetta richiesta con parametri /script.php/parametro1/parametro2 ---
    AcceptPathInfo On

    # --- SSL Configuration ---
    SSLEngine on
    SSLCertificateKeyFile    /etc/ssl/private/moodledev-key.pem
    SSLCertificateFile       /etc/ssl/certs/moodledev-cert.pem
    SSLCertificateChainFile  /etc/ssl/certs/moodledev-chain.pem

    # --- LOGGING SEPARATO IN /var/log/apache2/ ---
    LogLevel error warn ssl:warn
    
    # Set delle varibili
    SetEnvIf Request_URI "^/prod($|/)"      log_prod=1
    SetEnvIf Request_URI "^/m405($|/)"      log_m405=1
    SetEnvIf Request_URI "^/m500($|/)"      log_m500=1
    
    # Access Log per le singole sotto-cartelle
    CustomLog /var/log/apache2/prod-access.log      combined env=log_prod
    CustomLog /var/log/apache2/m405-access.log      combined env=log_m405
    CustomLog /var/log/apache2/m500-access.log      combined env=log_m500

    # Access Log fallback per il dominio
    CustomLog /var/log/apache2/moodledev-access.log combined "expr=!(reqenv('log_m405') == '1' || reqenv('log_prod') == '1' || reqenv('log_m500') == '1')"
    
    # Error Log fallback per dominio
    ErrorLog /var/log/apache2/moodledev-error.log

    # accelerare il download dei file in Moodle
    <IfModule mod_xsendfile.c>
       XSendFile On
       XSendFilePath /var/moodledata
    </IfModule>

    # --- ALIASES NUOVE CARTELLE (Puntano alle directory /public) ---
    Alias /prod      "/var/www/prod/public"
    Alias /m405      "/var/www/m405/public"
    Alias /m500      "/var/www/m500/public"

    # --- CONFIGURAZIONE GENERALE ---
    <Directory "/var/www">
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # PHP-FPM FastCGI Handler
        <FilesMatch "\.php$">
                SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>

        # Blocco globale file sensibili
        <FilesMatch "(^\.|config\.php|composer\.(json|lock)|environment\.xml|install\.xml|README|readme|upgrade\.txt)">
            Require all denied
        </FilesMatch>
    </Directory>

    # --- REGOLE DI ROUTING PER MOODLE 4.5+ / 5.x (SOSTITUISCE FALLBACKRESOURCE) ---
    # Gestisce correttamente il router r.php per ciascuna istanza
    <DirectoryMatch "^/var/www/[^/]+(/public)?$">
       Options -Indexes +FollowSymLinks
       AllowOverride None
       Require all granted
       FallbackResource /r.php
    </DirectoryMatch>

    # --- PROTEZIONE DIRETTA E TOTALE DI MOODLEDATA ---
    <Directory "/var/moodledata">
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>


    # --- HEADER DI SICUREZZA - Protezione contro attacchi XSS---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Gestione Errori ---
    ErrorDocument 404 /error/index.php
    ErrorDocument 403 /error/index.php?code=404

    # --- Gestione percorsi interni - Blocco delle richieste ---
    RewriteEngine On
 
    RewriteRule "(\/vendor\/)" - [F]
    RewriteRule "(\/node_modules\/)" - [F]
    RewriteRule "(^|/)\.(?!well-known\/)" - [F]
    RewriteRule "(composer\.json)" - [F]
    RewriteRule "(\.lock)" - [F]
    RewriteRule "(\/environment.xml)" - [F]
    Options -Indexes
    RewriteRule "(\/install.xml)" - [F]
    RewriteRule "(\/README)" - [F]
    RewriteRule "(\/readme)" - [F]
    RewriteRule "(\/moodle_readme)" - [F]
    RewriteRule "(\/upgrade\.txt)" - [F]
    RewriteRule "(\/UPGRADING\.md)" - [F]
    RewriteRule "(phpunit\.xml\.dist)" - [F]
    RewriteRule "(\/tests\/behat\/)" - [F]
    RewriteRule "(\/fixtures\/)" - [F]
    RewriteRule "(\/upgrade\.txt|UPGRADING\.md|UPGRADING\-CURRENT\.md)" - [F]

</VirtualHost>
</IfModule>
