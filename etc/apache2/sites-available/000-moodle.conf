# --- MONITORAGGIO: IP/reti autorizzati a leggere server-status e fpm-status ---
# Sostituire con l'IP (o la rete, es. 10.0.5.0/24) del server di monitoraggio.
# Piu' valori separati da spazio. Il valore di esempio (192.0.2.10, rete di documentazione)
# non corrisponde a nessun host: finche' non viene cambiato, accede solo localhost.
Define MONITORING_IPS "192.0.2.10"

<VirtualHost *:80>
    ServerName moodledev.esempio.dev
    ServerAdmin admin@esempio.dev
    DocumentRoot /var/www/moodle/public

    # Redirect permanente da HTTP a HTTPS
    Redirect permanent / https://moodledev.esempio.dev/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName moodledev.esempio.dev
    ServerAdmin admin@esempio.dev

    # Per Moodle 5.1+ con nuova struttura "public": /var/www/moodle/public
    # Per Moodle fino alla 5.0: /var/www/moodle
    DocumentRoot /var/www/moodle/public

    # --- ABILITAZIONE HTTP/2 ---
    Protocols h2 http/1.1

    # --- REQUISITO OBBLIGATORIO MOODLE (Slasharguments) ---
    AcceptPathInfo On

    # --- CERTIFICATI SSL ---
    # SSLCertificateChainFile e' deprecato da Apache 2.4.8: in futuro concatenare
    # certificato + catena in un unico file e usare solo SSLCertificateFile.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/moodledev-cert.pem
    SSLCertificateChainFile /etc/ssl/certs/moodledev-chain.pem
    SSLCertificateKeyFile   /etc/ssl/private/moodledev-key.pem

    # --- LOGGING DEDICATO E UNIFICATO ---
    LogLevel warn
    ErrorLog /var/log/apache2/moodledev-error.log
    # Le richieste periodiche del monitoraggio non finiscono nell'access log
    SetEnvIf Request_URI "^/(server-status|fpm-status|fpm-ping)$" monitoring_request
    CustomLog /var/log/apache2/moodledev-access.log combined env=!monitoring_request

    # --- X-SENDFILE: i download (pluginfile, video, SCORM, backup) li serve Apache ---
    # Senza, ogni download occupa un worker PHP-FPM per tutto il trasferimento.
    # Richiede: apt install libapache2-mod-xsendfile
    #           config.php -> $CFG->xsendfile = 'X-Sendfile';
    <IfModule mod_xsendfile.c>
        XSendFile On
        XSendFilePath /var/moodledata
    </IfModule>

    # --- CONFIGURAZIONE DOCUMENT ROOT ---
    <Directory "/var/www/moodle/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # ROUTER MOODLE 4.5+ / 5.x (Gestione r.php) - richiede $CFG->routerconfigured = true;
        FallbackResource /r.php

        # FastCGI Handler verso Socket UNIX PHP-FPM 8.3
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>

        # BLOCCO NATIVO FILE SENSIBILI (Sostituisce le vecchie RewriteRule)
        <FilesMatch "(^\.|^config\.php$|^composer\.(json|lock)$|^environment\.xml$|^install\.xml$|^README|^readme|^upgrade\.txt$|^UPGRADING(-CURRENT)?\.md$|^phpunit\.xml\.dist$)">
            Require all denied
        </FilesMatch>
    </Directory>

    # --- PROTEZIONE DIRETTA CARTELLE DI CODICE INTERNO ---
    <DirectoryMatch "/var/www/moodle/public/(.+/)?(vendor|node_modules|tests|fixtures)(/|$)">
        Require all denied
    </DirectoryMatch>

    # --- PROTECTION FAILSAFE MOODLEDATA ---
    <Directory "/var/moodledata">
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # --- MONITORAGGIO (solo localhost + MONITORING_IPS) ---
    # ATTENZIONE: server-status mostra IP dei client e URL delle richieste in corso:
    # non deve MAI essere raggiungibile da Internet.

    # Stato Apache (mod_status). Formato per tool: https://<host>/server-status?auto
    <IfModule mod_status.c>
        <Location "/server-status">
            SetHandler server-status
            Require local
            Require ip ${MONITORING_IPS}
        </Location>
    </IfModule>

    # Stato PHP-FPM (pm.status_path / ping.path).
    # Formati per tool: /fpm-status?json  /fpm-status?full  /fpm-status?openmetrics
    <LocationMatch "^/fpm-(status|ping)$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        Require local
        Require ip ${MONITORING_IPS}
    </LocationMatch>

    # --- EXPIRES CACHING (Prestazioni Asset Statici Moodle) ---
    # CSS/JS/immagini del tema sono serviti da Moodle (styles.php, javascript.php,
    # image.php) con header propri: queste regole valgono per i file statici diretti.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>

    # --- HEADER DI SICUREZZA ADVANCED ---
    # X-XSS-Protection rimosso: deprecato e ignorato dai browser moderni.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- GESTIONE ERRORI CUSTOM MOODLE ---
    ErrorDocument 404 /error/index.php
    ErrorDocument 403 /error/index.php?code=404

</VirtualHost>
</IfModule>
