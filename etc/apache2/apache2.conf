# --- Timeouts sincronizzati con PHP-FPM (10 minuti) ---
Timeout 600
ProxyTimeout 600

# --- Gestione Connessioni Persistenti ---
KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 3

# --- Hardening Sicurezza in /etc/apache2/conf-available/security.conf
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- Compressione Deflate (Essenziale per ridurre il traffico Moodle) in /etc/apache2/mods-available/deflate.conf
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json application/xml
</IfModule>