# ATTENZIONE: il file deve chiamarsi mpm_event.conf (senza "s"),
# altrimenti a2enmod non lo collega e Apache usa i default (MaxRequestWorkers 150).
<IfModule mpm_event_module>
    # --- Tuning MPM Event: VM frontend 32 vCPU / 64GB (PHP eseguito da PHP-FPM) ---

    # Processi di partenza (4 * 64 = 256 thread pronti all'avvio)
    StartServers              4

    # Limiti thread di riserva inattivi (MaxSpareThreads >= MinSpareThreads + ThreadsPerChild)
    MinSpareThreads         128
    MaxSpareThreads         512

    # Thread per ciascun processo worker Apache
    ThreadLimit              64
    ThreadsPerChild          64

    # Connessioni simultanee: 16 processi * 64 thread = 1024
    # Rapporto ~4:1 con pm.max_children di FPM (256): keep-alive, HTTP/2 e statici
    # occupano thread Apache ma non processi PHP.
    ServerLimit              16
    MaxRequestWorkers      1024

    # Apache non esegue PHP: nessun memory leak da contenere, nessun riciclo necessario
    MaxConnectionsPerChild    0

    # Connessioni asincrone (keep-alive/chiusura) gestibili per thread
    AsyncRequestWorkerFactor  2
</IfModule>
