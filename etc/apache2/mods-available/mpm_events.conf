<IfModule mpm_event_module>
    # --- Tuning MPM Event per Server 64GB RAM (Moodle + PHP-FPM Dedicated) ---
    
    # Processi di partenza (4 * 64 = 256 thread pronti all'avvio)
    StartServers             4
    
    # Limiti thread di riserva inattivi
    MinSpareThreads         128
    MaxSpareThreads         512
    
    # Thread per ciascun processo worker Apache
    ThreadLimit              64
    ThreadsPerChild          64
    
    # Massimo connessioni simultanee gestibili da Apache (16 processi * 64 thread = 1024 connessioni) oppure (32 processi + 64 thread = 2048 connessioni)
    ServerLimit              16
    MaxRequestWorkers      1024
    
    # Ricicla i processi per evitare memory leak nel lungo periodo
    MaxConnectionsPerChild  10000
</IfModule>