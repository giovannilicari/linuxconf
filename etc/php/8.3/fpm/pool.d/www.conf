[www]
; Pool PHP-FPM per Moodle - VM frontend dedicata 32 vCPU / 64GB RAM
; (DB e Redis su macchine separate)
;
; Budget RAM:  OS ~2GB | Apache ~1GB | OPcache ~1GB | FPM 256 x ~128MB = ~32GB
;              margine picchi ~6GB | page cache filesystem ~22GB (codice + localcache)
user = www-data
group = www-data

; --- Socket ---
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Coda richieste in attesa quando tutti i worker sono occupati (<= net.core.somaxconn)
listen.backlog = 1024

; --- Processi ---
; static: server dedicato, nessun costo di fork durante i picchi (es. avvio quiz)
pm = static
; 8 x vCPU. Tetto teorico dalla RAM ~400 (52GB / RSS medio): aumentare a 320-384
; solo se al picco CPU < 70% e nel log compare "max_children reached".
pm.max_children = 256
; Riciclo worker anti-memory-leak
pm.max_requests = 500

; --- Monitoraggio (esposto in Apache solo a localhost, vedi vhost) ---
pm.status_path = /fpm-status
ping.path = /fpm-ping

; --- Limits & Timeouts ---
security.limit_extensions = .php
; Timeout di sicurezza FPM (10 min, = Timeout/ProxyTimeout Apache)
request_terminate_timeout = 600s
; Traccia richieste sopra i 5 sec
request_slowlog_timeout = 5s

; --- Log PHP-FPM ---
slowlog = /var/log/php/php8.3-fpm.slow.log
; access.log disattivato: con 256 worker genera molto I/O. Riattivare solo per debug.
;access.log = /var/log/php/php8.3-fpm.access.log

; --- Override Parametri PHP ---
; php_value (NON php_admin_value) per memoria e tempo: Moodle deve poterli alzare
; da codice per backup/restore/report (raise_memory_limit, core_php_time_limit::raise).
php_value[memory_limit] = 512M
php_value[max_execution_time] = 600
php_value[max_input_time] = 600
php_admin_value[date.timezone] = Europe/Rome
php_admin_value[max_input_vars] = 10000
php_admin_flag[file_uploads] = on
php_admin_value[post_max_size] = 512M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[max_file_uploads] = 50
