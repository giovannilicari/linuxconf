[www]
; Pool di default per PHP-FPM (Moodle 1 Istanza - 64GB RAM)
user = www-data
group = www-data

; --- Socket ---
listen = /run/php/php8.3-fpm.sock
; --- Permessi Socket ---
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; --- Tuning Processi per Server da 64GB RAM ---
pm = dynamic
pm.max_children = 300          ; Max processi (54GB RAM / 180MB a processo)
pm.start_servers = 30          ; Processi iniziali (10%)
pm.min_spare_servers = 20      ; Processi inattivi minimi
pm.max_spare_servers = 60      ; Processi inattivi massimi
pm.max_requests = 1000         ; Riciclo worker anti-memory-leak
pm.process_idle_timeout = 10s

; --- Monitoraggio ---
pm.status_path = /status

; --- Limits & Timeouts ---
security.limit_extensions = .php
request_terminate_timeout = 600s     ; Timeout di sicurezza FPM (10 min)
request_slowlog_timeout = 5s         ; Traccia richieste sopra i 5 sec

; --- Log PHP-FPM (Gestiti ESCLUSIVAMENTE qui nel pool FPM) ---
slowlog    = /var/log/php/php8.3-fpm.slow.log
access.log = /var/log/php/php8.3-fpm.access.log

; --- Override Parametri PHP ---
php_admin_value[date.timezone] = Europe/Rome
php_admin_value[memory_limit] = 1024M
php_admin_value[max_execution_time] = 600
php_admin_value[max_input_time] = 600
php_admin_value[max_input_vars] = 10000
php_admin_flag[file_uploads] = on
php_admin_value[post_max_size] = 512M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[max_file_uploads] = 50