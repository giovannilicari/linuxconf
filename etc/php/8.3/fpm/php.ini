[PHP]
; Configurazione PHP per Server Dedicato Moodle (1 Istanza - 64GB RAM)
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
disable_functions =
disable_classes =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Nasconde la versione di PHP negli header HTTP
expose_php = Off

; Tempo massimo di esecuzione di uno script (in secondi)
max_execution_time = 120

; Tempo massimo per il parsing dei dati inviati dagli utenti
max_input_time = 120

; Memoria massima riservata a ogni singola richiesta PHP
memory_limit = 512M

; CRITICO PER MOODLE: Evita il troncamento dei dati in form complessi
; valutazioni (Gradebook) e gestione permessi/ruoli.
max_input_vars = 10000

; Profondità di nidificazione delle variabili di input
max_input_nesting_level = 128

; Cache del Filesystem per Moodle
; Aumenta la dimensione della memoria per i percorsi dei file (Default: 4M)
realpath_cache_size = 16M

; Aumenta il tempo di validità dei percorsi memorizzati in secondi (Default: 120)
realpath_cache_ttl = 600

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;; ERROR HANDLING AND LOGGING ;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Sicurezza Produzione: non mostrare mai gli errori agli utenti
display_errors = Off
display_startup_errors = Off

; Registra tutti gli errori nel log
log_errors = On
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

error_log = /var/log/php/php8.3-fpm.error.log

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; DATA HANDLING ;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

; Dimensione massima dei dati inviati tramite POST (deve coordinarsi con upload_max_filesize)
post_max_size = 256M

default_mimetype = "text/html"
default_charset = "UTF-8"

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;; PATHS AND DIRECTORIES ;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

doc_root =
user_dir =
enable_dl = Off

; FONDAMENTALE PER SICUREZZA APACHE/PHP-FPM: Previene l'esecuzione di codice arbitrario
;impostazione per MOODLE cgi.fix_pathinfo = 1 oppure lascialo commentato
;cgi.fix_pathinfo = 1


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;; FILE UPLOADS (MOODLE) ;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

file_uploads = On

; Dimensione massima per i file caricati (Pacchetti SCORM, video, backup corsi)
upload_max_filesize = 256M

; Numero massimo di file inviabili contemporaneamente
max_file_uploads = 50


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; DATE & TIMEZONE ;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Date]
date.timezone = Europe/Rome

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; SESSION SETTINGS ;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Session]
session.save_handler = files
session.serialize_handler = php
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = MoodleSession
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_httponly = On
session.cookie_samesite = "Lax"

; Moodle e Redis gestiscono la Garbage Collection autonomamente delle sessioni
session.gc_probability = 0
session.gc_divisor = 1000
session.gc_maxlifetime = 14400


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;; OPCACHE & JIT TUNING (Moodle 4.5+/5.x) ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; RAM riservata al Bytecode PHP (1 GB)
opcache.memory_consumption = 1024

; RAM riservata alle stringhe interne (128 MB)
opcache.interned_strings_buffer = 128

; Hash table ottimizzata per l'elevato numero di script di Moodle
opcache.max_accelerated_files = 65407

; REQUISITO OBBLIGATORIO MOODLE: Conserva le annotazioni nei commenti PHPDoc
opcache.save_comments = 1

; Frequenza di ri-validazione dei file (ogni 60 secondi)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

opcache.use_cwd = 1
opcache.enable_file_override = 0

; Ottimizzazione pagine di memoria grandi per CPU
opcache.huge_code_pages = 1

; --- JIT COMPILER (PHP 8.3) ---
; Modalità Tracing per compilare in codice macchina le funzioni Moodle ad alta frequenza
opcache.jit = tracing
opcache.jit_buffer_size = 128M