; OPcache per Moodle (solo FPM)
; priority=99
;
; Abilitazione SOLO per FPM:   phpenmod -s fpm moodle-opcache
; -> crea il symlink /etc/php/8.3/fpm/conf.d/99-moodle-opcache.ini
;
; Priorita' 99: caricato dopo opcache.ini (priority=10), ne sovrascrive i valori
; (es. opcache.jit=off) senza modificare il file gestito dal pacchetto php8.3-opcache.
; Non abilitarlo per la CLI: li' opcache resta spento (opcache.enable_cli = 0 nel php.ini CLI).

opcache.enable = 1

; RAM riservata al bytecode PHP (condivisa tra tutti i worker, non per processo)
opcache.memory_consumption = 1024

; RAM riservata alle stringhe interne (inclusa in memory_consumption)
opcache.interned_strings_buffer = 128

; Numero massimo di script in cache (Moodle + plugin ~30-40k file)
opcache.max_accelerated_files = 65407

; REQUISITO OBBLIGATORIO MOODLE: conserva le annotazioni nei commenti PHPDoc
opcache.save_comments = 1

; Ri-validazione dei file modificati ogni 60 secondi
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

opcache.use_cwd = 1
opcache.enable_file_override = 0

; Richiede hugepages configurate nel kernel: lasciare 0 se non configurate
opcache.huge_code_pages = 0

; JIT disattivato: Moodle e' limitato da I/O e DB, il guadagno e' trascurabile.
opcache.jit = off
opcache.jit_buffer_size = 0
